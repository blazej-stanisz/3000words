<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ff">
  <title>3000 Words — nauka angielskiego</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
  <div class="app-shell">
    <!-- Slot reklamy — docelowo baner AdMob (na razie mock) -->
    <div class="ad-slot" id="adSlot" aria-label="Reklama">
      <div class="ad-slot__mock">Reklama · 320×50</div>
    </div>

    <!-- Nazwa aplikacji — pod reklamą, na każdej stronie -->
    <div class="brand-bar">
      <span class="brand-bar__logo">3000</span>
      <span class="brand-bar__name">Words</span>
    </div>

    <main class="main" id="view" aria-live="polite"></main>

    <nav class="navbar" id="navbar">
      <button class="navbar__item" data-route="home">
        <svg viewBox="0 0 24 24" class="navbar__icon"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.8"/></svg>
        <span>Start</span>
      </button>
      <button class="navbar__item navbar__item--hidden" data-route="learn">
        <svg viewBox="0 0 24 24" class="navbar__icon"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5V5.5Z"/></svg>
        <span>Nauka</span>
      </button>
      <button class="navbar__item navbar__item--hidden" data-route="review">
        <svg viewBox="0 0 24 24" class="navbar__icon"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></svg>
        <span>Powtórka</span>
      </button>
      <button class="navbar__item" data-route="stats">
        <svg viewBox="0 0 24 24" class="navbar__icon"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
        <span>Postępy</span>
      </button>
      <button class="navbar__item" data-route="boxes">
        <svg viewBox="0 0 24 24" class="navbar__icon"><path d="M3 7h18v13H3z"/><path d="M3 7l2-3h14l2 3"/><path d="M12 7v13"/></svg>
        <span>Przegródki</span>
      </button>
      <button class="navbar__item" data-route="settings">
        <svg viewBox="0 0 24 24" class="navbar__icon"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
        <span>Ustawienia</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="data/bundle.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/learn.js"></script>
  <script src="js/views/review.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/boxes.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
